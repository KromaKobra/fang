<?xml version="1.0" encoding="UTF-8"?>
<!-- Fang app icon: a folder with a fang-like chevron bite. -->
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#313244"/>
      <stop offset="1" stop-color="#1e1e2e"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5c3fb"/>
      <stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- folder body -->
  <path d="M 22 40
           q 0 -6 6 -6 h 22 l 8 10 h 42 q 6 0 6 6 v 40 q 0 6 -6 6 h -72 q -6 0 -6 -6 z"
        fill="url(#folder)"/>
  <!-- fang chevron bite -->
  <path d="M 50 60 l 14 26 l 14 -26 z" fill="#11111b"/>
  <path d="M 54 60 l 10 18 l 10 -18 z" fill="#f38ba8"/>
</svg>
